[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-ontology-agent"
version = "0.1.0"
description = "Grounded enterprise ontology agent with Neo4j, typed retrieval, evaluation, and read-only MCP tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2,<3",
  "neo4j>=5.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "mcp[cli]>=2,<3",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
